[project]
name = "gymnax"
version = "1.0.1"
description = "JAX-native reinforcement-learning environments"
authors = [{ name = "Robert Tjarko Lange", email = "robertlange0@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    # Bound to combinations CI actually covers rather than removing the
    # ceilings outright. Python 3.14 needs a narrower JAX/Flax window -- JAX
    # gained 3.14 wheels in 0.8.1 and Flax fixed a 3.14 `__annotations__`
    # regression in 0.12.3 -- so unsupported combinations fail resolution.
    "jax>=0.6,<0.12; python_version < '3.14'",
    "jax>=0.8.1,<0.12; python_version >= '3.14'",
    "flax; python_version < '3.14'",
    "flax>=0.12.3; python_version >= '3.14'",
    "gymnasium>=1.1,<1.4",
    "matplotlib",
    "seaborn",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
test = [
    "bsuite>=0.3.6,<0.4",
    "chex",
    "flax",
    "brax",
    "minatar",
]
visualize = [
    # gymnasium switched classic-control rendering to pygame-ce in 1.3, which
    # is what supplies Python 3.14 wheels; pygame 2.6.1 has none.
    "gymnasium[classic-control]>=1.1,<1.4; python_version < '3.14'",
    "gymnasium[classic-control]>=1.3,<1.4; python_version >= '3.14'",
]

[project.urls]
Homepage = "https://github.com/RobertTLange/gymnax"

[tool.setuptools.packages.find]
where = ["."]
include = ["gymnax*"]

[tool.ruff]
exclude = ["examples"]
# ruff >=0.16 also formats Markdown code blocks; keep the formatter
# scoped to Python, as it was under the previously locked 0.11.
extend-exclude = ["*.md"]
target-version = "py310"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "SIM", "UP", "W"]
ignore = ["N801", "N802", "N803", "N806", "N815", "W191"]

[tool.ruff.lint.isort]
combine-as-imports = true
