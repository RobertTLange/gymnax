[project]
name = "gymnax"
version = "1.0.0"
description = "JAX-native reinforcement-learning environments"
authors = [{ name = "Robert Tjarko Lange", email = "robertlange0@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "jax>=0.6,<0.7",
    "flax",
    "gymnasium>=1.1,<1.2",
    "matplotlib",
    "seaborn",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
test = [
    "bsuite>=0.3.6,<0.4",
    "chex",
    "flax",
    "brax",
    "minatar",
]
visualize = [
    "gymnasium[classic-control]>=1.1,<1.2",
]

[project.urls]
Homepage = "https://github.com/RobertTLange/gymnax"

[tool.setuptools.packages.find]
where = ["."]
include = ["gymnax*"]

[tool.ruff]
exclude = ["examples"]
target-version = "py310"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "SIM", "UP", "W"]
ignore = ["N801", "N802", "N803", "N806", "N815", "W191"]

[tool.ruff.lint.isort]
combine-as-imports = true
